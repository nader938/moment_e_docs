name: Validate

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  check-links:
    name: Build & Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (fails on broken links)
        run: npm run build
